# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

resources:
  repositories:
  - repository: pipelines-dotnet-core # The name used to reference this repository in the checkout step
    type: github
    endpoint: PistolPete17
    name: PistolPete17/pipelines-dotnet-core
  pipelines:
  - pipeline: pipelines-dotnet-core # Name of the pipeline resource.
    source: PistolPete17.pipelines-dotnet-core # The name of the pipeline referenced by this pipeline resource.
    project: pipeline1 # Required only if the source pipeline is in another project
    trigger: true # Run app-ci pipeline when any run of security-lib-ci completes
   
trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'
- checkout: pipelines-dotnet-core

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'
